name: Release candidate preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - net/port/**
      - third_party/**
      - tools/**
      - docs/**
      - LICENSE
      - NOTICE
      - .github/workflows/release-candidate.yml

permissions:
  contents: read

jobs:
  macos-candidate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and UEFI target
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target x86_64-unknown-uefi
      - name: Install Clang and QEMU
        run: |
          brew install llvm qemu
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "MUSHA_FIRMWARE_DIR=$(brew --prefix qemu)/share/qemu" >> "$GITHUB_ENV"
      - name: Record tool and firmware versions
        run: |
          mkdir -p out/ci
          rustc -vV > out/ci/rustc.txt
          "$CC" --version > out/ci/clang.txt
          qemu-system-x86_64 --version > out/ci/qemu.txt
          shasum -a 256 "$MUSHA_FIRMWARE_DIR/edk2-x86_64-code.fd" "$MUSHA_FIRMWARE_DIR/edk2-i386-vars.fd" > out/ci/firmware-sha256.txt
      - name: Host and package tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace --exclude musha-boot
          cargo check --locked --target x86_64-unknown-uefi --lib -p musha-bce -p musha-input -p musha-fs
          for directory in third_party/lwip third_party/freebsd-e1000 third_party/freebsd-apple-bce third_party/r-efi; do
            (cd "$directory" && shasum -a 256 -c SHA256SUMS)
          done
          python3 tools/test-exfat-fixture.py
          python3 tools/test-usb-image.py
          python3 tools/test-usb-build.py
          python3 tools/test-release-package.py
      - name: HID mutation and state properties
        timeout-minutes: 2
        run: |
          cargo run --locked --release -p musha-input --example hid_fuzz -- 100000 7445454
          cargo run --locked --release -p musha-input --example hid_fuzz -- 100000 123456789
      - name: Measure HID UEFI memory layout
        run: python3 tools/measure-hid-memory.py
      - name: Build diagnostic USB image
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features qemu-debug
          mkdir -p out/esp/EFI/BOOT
          cp target/x86_64-unknown-uefi/release/musha-boot.efi out/esp/EFI/BOOT/BOOTX64.EFI
          python3 tools/make-usb-image.py out/ci/debug.img
      - name: QEMU USB, input and network regression
        run: |
          python3 tools/smoke-qemu.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/debug.img
          python3 tools/smoke-network.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/debug.img
          for case in traffic input-idle no-keyboard keyboard-disconnect link-down; do
            python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/debug.img --case "$case"
          done
      - name: QEMU multi-controller and hub regression
        run: |
          python3 tools/smoke-qemu.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --keyboard-exit --keyboard-wrap --fat-fixture gpt --extra-xhci --devices-second
          python3 tools/smoke-qemu.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --keyboard-exit --fat-fixture gpt --hub-depth 5 --keyboard-usb-version 1
          python3 tools/smoke-qemu.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --keyboard-exit --extra-xhci --keyboard-second
      - name: QEMU live storage with input and network
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features live-storage-probe
          python3 tools/make-usb-image.py out/ci/live-storage.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/live-storage.img --case traffic --live-storage
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/live-storage.img --case traffic --live-storage --hub-depth 2
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/live-storage.img --case traffic --live-storage --live-fault disconnect
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features live-storage-timeout
          python3 tools/make-usb-image.py out/ci/live-storage-timeout.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/live-storage-timeout.img --case traffic --live-storage --live-fault timeout
      - name: QEMU common file API over retained USB
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features live-file-probe
          python3 tools/make-usb-image.py out/ci/live-file.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/live-file.img --case traffic --live-file
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/live-file.img --case traffic --live-file --live-file-cancel
      - name: QEMU exception and timeout regression
        run: |
          for case in ud gp df pf ro nx guard xhci-timeout xhci-command-timeout usb-descriptor-timeout storage-timeout; do
            case "$case" in
              ud|gp|df|pf|ro|nx|guard) feature="fault-$case" ;;
              *) feature="$case" ;;
            esac
            cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features "$feature"
            cp target/x86_64-unknown-uefi/release/musha-boot.efi out/esp/EFI/BOOT/BOOTX64.EFI
            python3 tools/smoke-qemu.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --case "$case"
          done
      - name: QEMU exFAT common file API
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features live-exfat-probe
          python3 tools/make-usb-image.py out/ci/exfat-boot.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          python3 tools/make-exfat-fixture.py out/ci/exfat-data.img > out/ci/exfat-manifest.txt
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image out/ci/exfat-boot.img --usb-image out/ci/exfat-data.img --case traffic --live-file
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image out/ci/exfat-boot.img --usb-image out/ci/exfat-data.img --case traffic --live-file --live-file-cancel
      - name: QEMU split-controller file service and faults
        run: |
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image out/ci/exfat-boot.img --usb-image out/ci/exfat-data.img --live-file --split-controller
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image out/ci/exfat-boot.img --usb-image out/ci/exfat-data.img --live-file --split-controller --live-file-cancel
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image out/ci/exfat-boot.img --usb-image out/ci/exfat-data.img --live-file --split-controller --file-fault disconnect
          for probe in close timeout; do
            cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features "file-app-$probe"
            python3 tools/make-usb-image.py "out/ci/file-$probe.img" --efi target/x86_64-unknown-uefi/release/musha-boot.efi
            if [ "$probe" = close ]; then
              python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image "out/ci/file-$probe.img" --usb-image out/ci/exfat-data.img --live-file --split-controller --file-close
            else
              python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image "out/ci/file-$probe.img" --usb-image out/ci/exfat-data.img --live-file --split-controller --file-fault timeout
            fi
          done
      - name: QEMU app file API without artificial transport delays
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features file-app-probe
          python3 tools/make-usb-image.py out/ci/file-app.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/file-app.img --live-file --file-no-delay
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --exfat-boot-image out/ci/file-app.img --usb-image out/ci/exfat-data.img --live-file --split-controller --file-no-delay
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/file-app.img --case no-keyboard
          python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image out/ci/file-app.img --case keyboard-disconnect --split-controller
      - name: QEMU file viewer selection and page navigation
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features file-viewer-probe
          python3 tools/make-usb-image.py out/ci/viewer.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          python3 tools/smoke-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image out/ci/viewer.img --data-image out/ci/viewer.img --format fat32
          python3 tools/smoke-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image out/ci/viewer.img --data-image out/ci/exfat-data.img
          python3 tools/smoke-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image out/ci/viewer.img --data-image out/ci/exfat-data.img --split-controller
          python3 tools/make-exfat-fixture.py out/ci/viewer-corrupt.img --case boot-checksum
          python3 tools/smoke-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image out/ci/viewer.img --data-image out/ci/viewer-corrupt.img --case no-medium
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features file-viewer-probe,live-file-probe
          python3 tools/make-usb-image.py out/ci/viewer-delay.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          for case in cancel disconnect; do
            python3 tools/smoke-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image out/ci/viewer-delay.img --data-image out/ci/exfat-data.img --split-controller --case "$case"
          done
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features file-viewer-probe,file-app-timeout
          python3 tools/make-usb-image.py out/ci/viewer-timeout.img --efi target/x86_64-unknown-uefi/release/musha-boot.efi
          python3 tools/smoke-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image out/ci/viewer-timeout.img --data-image out/ci/exfat-data.img --split-controller --case timeout
      - name: QEMU application failure and TX timeout
        run: |
          for pair in "net-tx-timeout tx-timeout" "app-step-error app-error"; do
            feature=${pair%% *}
            case=${pair#* }
            cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features "$feature"
            cp target/x86_64-unknown-uefi/release/musha-boot.efi out/esp/EFI/BOOT/BOOTX64.EFI
            python3 tools/make-usb-image.py "out/ci/$case.img"
            python3 tools/smoke-cooperative.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --usb-image "out/ci/$case.img" --case "$case"
          done
      - name: QEMU corrupt GPT/FAT32 regression
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi -p musha-boot --features qemu-debug
          cp target/x86_64-unknown-uefi/release/musha-boot.efi out/esp/EFI/BOOT/BOOTX64.EFI
          python3 tools/smoke-qemu.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --case fat-corrupt --fat-fixture gpt
      - name: Build a fresh normal candidate (no publication)
        run: python3 tools/prepare-release.py --output dist/v0.2.0-candidate
      - name: Normal candidate display and input acceptance
        run: |
          bundle=dist/v0.2.0-candidate/musha-os-0.2.0-candidate
          python3 tools/smoke-normal-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image "$bundle/musha-qemu-64MiB.img" --data-image "$bundle/exfat-test-data.img" --reference out/qemu-viewer-exfat-normal --output out/qemu-normal-exfat
          python3 tools/smoke-normal-viewer.py --firmware-dir "$MUSHA_FIRMWARE_DIR" --boot-image "$bundle/musha-qemu-64MiB.img" --data-image "$bundle/musha-qemu-64MiB.img" --reference out/qemu-viewer-fat32-normal --output out/qemu-normal-fat32
      - name: Preserve logs and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.2.0-candidate-and-test-records
          path: |
            out/ci/*.txt
            out/hid-memory/report.json
            out/hid-memory/*.s
            out/qemu-*/debug.log
            out/qemu-*/qemu.log
            out/qemu-*/*.ppm
            out/qemu-*/result.json
            dist/v0.2.0-candidate/
          if-no-files-found: warn

# This workflow never creates a tag or GitHub Release, or writes a physical disk.
# QEMU diagnostics test a debug build; the normal candidate still needs its own
# boot/display/input verification and physical hardware acceptance.
